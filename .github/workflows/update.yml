name: Update LifeHub

on:
  schedule:
    # 16:23 UTC is 3:23am in Sydney during daylight saving (AEDT) and 2:23am otherwise
    # (AEST). Scheduled runs can start late, so this leaves plenty of room before 6am.
    - cron: "23 16 * * *"
  workflow_dispatch:
    inputs:
      research:
        description: "Run Claude's web research (untick to just rebuild the page)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lifehub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RESEARCH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.research) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the branch's latest commit, not the triggering one, so a run that
          # waited in the queue can't republish an older briefing.
          ref: ${{ github.ref_name }}
          # Keep the job token out of .git/config, where Claude's tools could read it.
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        if: env.RESEARCH == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: env.RESEARCH == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Research and write the briefing
        if: env.RESEARCH == 'true'
        timeout-minutes: 50
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) repository secret."
            exit 1
          fi

          now="$(TZ=Australia/Sydney date '+%A %-d %B %Y, %-I:%M%p %Z')"
          prompt="The current time in Sydney is ${now}."$'\n\n'"$(cat prompts/briefing.md)"

          args=(
            -p "$prompt"
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3 scripts/build.py:*)"
            --max-turns 200
          )
          if [ -n "$CLAUDE_MODEL" ]; then
            args+=(--model "$CLAUDE_MODEL")
          fi
          claude "${args[@]}"

          # Only the briefing should change. Restore anything else Claude touched so the
          # repo's own build script validates the result.
          git checkout -- . ':(exclude)data/briefing.json'

      - name: Validate and build the page
        run: |
          if [ "$RESEARCH" = "true" ]; then
            # Refuse to publish if Claude didn't write a new briefing this run.
            python3 scripts/build.py --require-fresh 3
          else
            python3 scripts/build.py
          fi

      - name: Commit the briefing
        if: env.RESEARCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          if git diff --cached --quiet; then
            echo "Briefing unchanged."
            exit 0
          fi
          git commit -m "Update briefing for $(TZ=Australia/Sydney date +%F)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" "$GITHUB_REF_NAME"
          git push "$remote" "HEAD:$GITHUB_REF_NAME"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
