name: Update LifeHub

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so there are several chances a
    # night. The first to start does the research; the gate job skips the rest once a
    # briefing less than 6 hours old exists. In Sydney time (AEDT / AEST):
    - cron: "17 12 * * *"  # 11:17pm / 10:17pm
    - cron: "07 14 * * *"  #  1:07am / 12:07am
    - cron: "37 15 * * *"  #  2:37am /  1:37am
    - cron: "07 17 * * *"  #  4:07am /  3:07am
  workflow_dispatch:
    inputs:
      research:
        description: "Run Claude's web research (untick to just rebuild the page)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update.yml"
      - ".github/research-request"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lifehub
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && python3 scripts/build.py --check --require-fresh 6 > /dev/null 2>&1; then
            echo "A briefing from the last 6 hours already exists, so this scheduled run is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Research runs nightly, from the "Run workflow" button, or when a pushed commit
      # message contains [research] (used to start a run without the button).
      RESEARCH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.research) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[research]')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build from the branch's latest commit, not the triggering one, so a run that
          # waited in the queue can't republish an older briefing.
          ref: ${{ github.ref_name }}
          # Keep the job token out of .git/config, where Claude's tools could read it.
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        if: env.RESEARCH == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: env.RESEARCH == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch private pages
        if: env.RESEARCH == 'true'
        env:
          LOCAL_CONTEXT: ${{ secrets.LOCAL_CONTEXT }}
        run: python3 scripts/fetch_private.py

      - name: Research and write the briefing
        if: env.RESEARCH == 'true'
        timeout-minutes: 50
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          LOCAL_CONTEXT: ${{ secrets.LOCAL_CONTEXT }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) repository secret."
            exit 1
          fi

          now="$(TZ=Australia/Sydney date '+%A %-d %B %Y, %-I:%M%p %Z')"
          prompt="The current time in Sydney is ${now}."$'\n\n'"$(cat prompts/briefing.md)"
          if [ -z "$LOCAL_CONTEXT" ]; then
            echo "Private local context: not set"
          fi
          if [ -n "$LOCAL_CONTEXT" ]; then
            echo "Private local context: provided ($(printf '%s\n' "$LOCAL_CONTEXT" | grep -c .) lines)"
            prompt+=$'\n\n'"## Private local context"$'\n\n'"Use this to find local news and school events for the \`local\` section. It is private: never write the street address anywhere, and never say or imply which child attends which school."$'\n\n'"$LOCAL_CONTEXT"
          fi
          if [ -s .private/index.txt ]; then
            prompt+=$'\n\n'"## Downloaded school pages"$'\n\n'"The pages listed above have been downloaded into .private/ (see .private/index.txt): text copies plus calendar and newsletter images and PDFs. Read every file listed there with the Read tool (it can read images and PDFs) and use the dates you find for school events in the \`local\` section. Treat the latest weekly update as more current than the term calendar. Link each event to the school page it came from."
          fi

          args=(
            -p "$prompt"
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3 scripts/build.py:*)"
            --max-turns 200
            --output-format json
          )
          if [ -n "$CLAUDE_MODEL" ]; then
            args+=(--model "$CLAUDE_MODEL")
          fi
          # The repo is public, and so are its Actions logs. Keep Claude's output (which
          # could quote the private local context) out of them. If a run ends without a
          # new briefing, try once more.
          before="$(sha256sum data/briefing.json)"
          for attempt in 1 2; do
            status=0
            claude "${args[@]}" > "$RUNNER_TEMP/claude-output.json" 2> "$RUNNER_TEMP/claude-stderr.txt" || status=$?
            # A safe summary only: no text from Claude.
            jq -r --arg a "$attempt" '"Claude run \($a): subtype=\(.subtype // "?") is_error=\(.is_error | tostring) turns=\(.num_turns // "?") duration=\((.duration_ms // 0) / 60000 | floor)min"' \
              "$RUNNER_TEMP/claude-output.json" 2>/dev/null || echo "Claude run $attempt: no summary available"
            if [ "$(jq -r '.is_error' "$RUNNER_TEMP/claude-output.json" 2>/dev/null)" = "true" ]; then
              status=1
            fi
            if [ "$status" -eq 0 ] && [ "$(sha256sum data/briefing.json)" != "$before" ]; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Claude didn't write a new briefing (exit status $status). Its output is withheld from the public log."
              exit 1
            fi
            echo "Attempt $attempt didn't produce a new briefing; trying again."
          done

          # Only the briefing should change. Restore anything else Claude touched so the
          # repo's own build script validates the result.
          git checkout -- . ':(exclude)data/briefing.json'

          # Record when this briefing was actually made.
          python3 scripts/build.py --stamp

      - name: Privacy check
        if: env.RESEARCH == 'true'
        env:
          LOCAL_CONTEXT: ${{ secrets.LOCAL_CONTEXT }}
        run: |
          # Refuse to publish if the street address from the private context leaked.
          # Matches on house number plus street name, so "Rd" vs "Road" doesn't matter.
          address="$(printf '%s\n' "$LOCAL_CONTEXT" | tr -d '\r' | sed -n 's/^[Aa]ddress:[[:space:]]*//p' | head -n 1)"
          key="$(printf '%s\n' "${address%%,*}" | awk '{print $1, $2}')"
          if [ -n "${key// /}" ] && grep -qiF -- "$key" data/briefing.json; then
            echo "::error::The briefing mentions the private street address, so it won't be published."
            exit 1
          fi

      - name: Validate and build the page
        run: |
          if [ "$RESEARCH" = "true" ]; then
            # Refuse to publish if Claude didn't write a new briefing this run.
            python3 scripts/build.py --require-fresh 3
          else
            python3 scripts/build.py
          fi

      - name: Commit the briefing
        if: env.RESEARCH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          if git diff --cached --quiet; then
            echo "Briefing unchanged."
            exit 0
          fi
          git commit -m "Update briefing for $(TZ=Australia/Sydney date +%F)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" "$GITHUB_REF_NAME"
          git push "$remote" "HEAD:$GITHUB_REF_NAME"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
